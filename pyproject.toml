[project]
name = "production-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charan Kotra", email = "charankotra11@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-qdrant>=1.1.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
production-rag = "production_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
