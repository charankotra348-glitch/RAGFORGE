[project]
name = "ragforge"
version = "0.1.0"
description = "Hybrid retrieval-augmented generation (Qdrant + BM25 + reranking + local LLM) with a deterministic evaluation suite"
readme = "README.md"
authors = [
    { name = "Charan Kotra", email = "charankotra348@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=6.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-community>=0.3",
    "qdrant-client>=1.13",
    "sentence-transformers>=3.0",
    "fastembed>=0.7",
    "pypdf>=6.19.0",
    "ollama>=0.6.2",
    "rank-bm25>=0.2.2",
]


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
